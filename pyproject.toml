[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "script-to-shorts"
version = "0.1.0"
description = "Turn a script into a vertical AI short"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "edge-tts>=7.2.0",
  "httpx>=0.27.0",
  "imageio-ffmpeg>=0.5.1",
  "moviepy>=2.1.2",
  "pillow>=10.4.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
local = [
  "accelerate>=0.34.0",
  "diffusers>=0.31.0",
  "huggingface-hub>=0.25.0",
  "piper-tts>=1.2.0",
  "safetensors>=0.4.0",
  "torch>=2.4.0",
  "transformers>=4.44.0",
]

[project.scripts]
script-to-shorts = "script_to_shorts.cli:main"
script-to-shorts-web = "script_to_shorts.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
script_to_shorts = ["static/*.html"]
